# One-off maintenance job, added Aug 2026 and meant to be deleted straight after
# it succeeds. Do not extend it into a general-purpose tool.
#
# The Aug 2026 history rewrite (git filter-repo, stripping the resolver hostname
# from 60 commits) reached master and the working branch but not refs/tags/*.
# The automation environment's git credentials are refused with HTTP 403 on any
# tag write - including creating an unrelated throwaway tag, so it is a
# credential scope limit rather than a transient failure. An Actions runner's
# GITHUB_TOKEN with contents:write is not, which is the whole reason this exists.
#
# Every tag below is pinned to the rewritten commit for the same release. The
# mapping came from git-filter-repo's commit-map, and all 34 targets were checked
# to be reachable from master before this file was written. Tag names never
# change, so the 34 GitHub Releases stay attached to their tags.
name: Repoint release tags onto rewritten history

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "repoint" to confirm. Anything else aborts.'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  repoint:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "repoint" ]; then
            echo "::error::confirmation not given - nothing done"; exit 1
          fi

      # fetch-depth 0: the targets are ordinary commits on master's history and
      # a shallow checkout would not have them to point a tag at.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repoint the tags
        run: |
          set -e
          git tag -f v26.11.1 f8ca17cc93be9b8dd048ddf97e7b7a08f6f4f83c
          git tag -f v26.11.2 09f3c9dce1d285d73a7604f3345a03346bfa78c5
          git tag -f v26.11.3 706834b361b991a4ba68e059a89bba1192560451
          git tag -f v26.11.4 5bdb403027ee7a13526e780da9558f1e0063511c
          git tag -f v26.11.5 0190c745832bc549795a2d972f0ed20d2c9ac151
          git tag -f v26.11.6 06c897f344cd15207bdb0dd0a803d56dad568530
          git tag -f v26.11.7 cbbcc6811e6a78f855d2b5e556c08e1dc40c6c00
          git tag -f v26.11.8 a439e58dc0f27c433698a3c0e4f9a64a4233da0f
          git tag -f v26.11.9 0ddc27d8e5106bfb19a198a18e883e2c2132eea1
          git tag -f v26.11.10 cba2277dcd852b63ded20249f83c5e03abdb77f5
          git tag -f v26.11.11 b18aeb469bfd16c4709abef923e37675c835e6c0
          git tag -f v26.11.12 fc1aeb939368af463deb66059d42720225e70111
          git tag -f v26.11.13 97ba79369d4860d9789bc09a047384c2efd253f5
          git tag -f v26.11.14 eb5f5d404f18a03b1700586e67ca890776768ea0
          git tag -f v26.11.15 d762962b47b849a8517afd5a6dd004470e158df6
          git tag -f v26.11.16 a82053d3677a279a10b1c2b0dd79b07b5502628a
          git tag -f v26.11.17 40c844681643984ebf6dc76e17bbe0d684eceaa3
          git tag -f v26.11.18 cd0a82080e81f13e22e4efa9ff7238ccba7b690b
          git tag -f v26.11.19 c8911c6f726cf38037d51bfd1ebbe77c6606406d
          git tag -f v26.11.20 c8d9b097c069bf0b1bf0dad30d2e8953bf6be146
          git tag -f v26.11.21 c36742175fb03d9aa70b45182b493db6f3e400c4
          git tag -f v26.11.22 2d60b1fbcf77c66163848a780ba81670d2e8e407
          git tag -f v26.11.23 22a6b4b0ca40d6929526a1ae146c456bf74b67a3
          git tag -f v26.11.24 1b81f26e7138bf4931c284115af57ad1e3938b55
          git tag -f v26.11.25 961729cfc5bf3e8fc1ea35f91b1778421741d651
          git tag -f v26.11.26 8b139c089e554dbd7a7a7c0f061c3906274c2fcf
          git tag -f v26.11.27 93f0811b4821c8fe2a020a9475e93d5ca10d0731
          git tag -f v26.11.28 eb52dea62b85363b6aa213beb742fada1a9a1b91
          git tag -f v26.11.29 1095235442152c754075a03a518926039218ce16
          git tag -f v26.11.30 221c7aa139914293a39efc8d593a9d2ba3484b36
          git tag -f v26.11.31 ceab361ba8b058eda1b3382137479d29720cbf29
          git tag -f v26.11.32 c2e22c5b65c5d81cae3b2c2c22a206a52f532ddf
          git tag -f v26.11.33 37a21ffcce6915ae062e4d659cd0cb66aaa80ff9
          git tag -f v26.11.34 ce5d003d67769d8af2ba67d11119860910b63060

      - name: Push them
        run: git push --force --tags origin

      # A tag that still points at a pre-rewrite commit keeps the old history
      # reachable from a fresh clone, which is the entire thing this undoes. So
      # prove it landed rather than trusting the push's exit code.
      - name: Verify every tag moved
        run: |
          git fetch --tags --force origin
          bad=0
          for t in $(git tag); do
            local_sha=$(git rev-parse "$t")
            remote_sha=$(git ls-remote origin "refs/tags/$t" | cut -f1)
            if [ "$local_sha" != "$remote_sha" ]; then
              echo "::error::$t did not move (remote $remote_sha)"; bad=$((bad+1))
            fi
          done
          if [ "$bad" -ne 0 ]; then echo "::error::$bad tag(s) still stale"; exit 1; fi
          echo "all $(git tag | wc -l) tags point at the rewritten history"
